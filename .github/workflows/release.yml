name: release

# Builds Drovix Portal desktop for Windows, macOS (Apple Silicon) and Linux.
#
# Two triggers, two behaviours:
#
#   * push of a `v*.*.*` tag  -> build all three platforms, create a DRAFT
#     GitHub Release named after the tag and attach the bundles plus the
#     updater `latest.json` + `.sig` files. An operator publishes the draft;
#     only then does `releases/latest/download/latest.json` (the updater
#     endpoint baked into tauri.conf.json) start pointing at it.
#
#   * workflow_dispatch (manual smoke run from any branch) -> build the same
#     matrix but create NO release and touch NO tag. Bundles are uploaded as
#     workflow artifacts only. tauri-action creates a release whenever it is
#     given a tagName, so the release step is gated on `refs/tags/` to make a
#     stray "main" release impossible.
#
# Unsigned builds: the Apple Developer / Windows EV certificate secrets are
# not wired yet (tracked as procurement in README). tauri-action interprets an
# empty APPLE_CERTIFICATE as "sign with an empty keychain entry" and fails the
# macOS job, so those env vars are left unset entirely. When the certs are
# bought, add them to the release step and nothing else changes.
#
# Tauri's own updater signing IS active from day one: TAURI_SIGNING_PRIVATE_KEY
# signs every bundle so the public key embedded in the app can verify future
# auto-updates. Without it the updater plugin refuses to install anything.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon (M1/M2/M3/M4)
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel Mac (macos-13 runner) was removed 2026-05-18 because the
          # GitHub-hosted Intel pool has multi-hour queue spikes that block
          # the whole release. The pre-2020 Intel Mac install base is
          # already shrinking fast; reintroduce only if a specific client
          # asks for it.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Tauri demands a frontendDist on disk even when the window URL is
      # remote, so we materialize the placeholder html the repo expects.
      - name: Ensure frontendDist placeholder
        shell: bash
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || echo '<!DOCTYPE html><meta charset="utf-8"><title>Drovix Portal</title>' > dist/index.html

      - name: Rust unit tests (link / navigation policy)
        working-directory: src-tauri
        run: cargo test --locked

      # ---- Manual smoke run: build only, never create a release ------------
      - name: Build Tauri bundles (smoke, no release)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No tagName / releaseName / releaseId => tauri-action only builds.
          args: ${{ matrix.args }}

      - name: Upload smoke-run bundles as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: drovix-portal-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.sig

      # ---- Tag push: build + draft release with latest.json ----------------
      - name: Build Tauri bundles and draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing secrets (APPLE_*, WINDOWS_*) intentionally absent —
          # see the header comment.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Drovix Portal ${{ github.ref_name }}"
          releaseBody: |
            Drovix Portal desktop ${{ github.ref_name }}.

            **First-launch warning:** this build is unsigned. Right-click
            and choose Open on macOS the first time; click "Run anyway" on
            Windows SmartScreen. Future releases will be code-signed.

            Built from `${{ github.sha }}`.
          releaseDraft: true
          prerelease: false
          # Updater JSON: prefer the NSIS setup.exe for Windows so in-app
          # updates use the same per-user installer the desk installed with.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
